<!DOCTYPE html>
<html lang="en-ca">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Simple Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="shortcut icon" type="image/svg+xml" href="favicon.svg" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Mono:wght@100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@40,400,0,0&icon_names=add,menu,check,close,delete" />
<link rel="stylesheet" href="style.css" />
<script type="text/javascript" src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script type="text/javascript" src="idb.js"></script>
<script type="text/javascript" src="ledger.js"></script>
<script type="text/javascript" src="script.js"></script>

<script type="text/javascript">


</script>
</head>
<body>
    <span id="Buttons" class="Right">
        <button data-action="plus_btn" title="New Transaction"><span class="material-symbols-outlined">add</span></button>
        <button data-action="menu_btn" title="Menu"><span class="material-symbols-outlined">menu</span></button>
    </span>
    <main>
        <p>Please choose one of the following ledger databases:</p>
        <ul id="Welcome"></ul>
    </main>
    <div id="Cover"></div>
    <div id="Dialogs">

<section id="Edit_Date">
    <h2 class="Center">Report Dates</h2>
    <p class="hpad1"><input type="date"/>&nbsp; &ndash; &nbsp;<input type="date"/></p>
    <p class="Buttons">
        <button data-action="edit_date"><span class="material-symbols-outlined">check</span><br/>Save<br/>Changes</button>
        <button data-action="go_main"><span class="material-symbols-outlined">close</span><br/>Cancel<br/>Changes</button>
    </p>
</section>

<section id="Tran_New">
    <input type="number" value="-1" class="Hidden"/>
    <h2 class="Center">Edit Transaction</h2>
    <p><input type="text" placeholder="Description" class="em32"/> <span class="Right" style="padding-left:2em"><input type="date"/></span></p>
    <table>
        <thead><tr><th>Account</th><th title="Increase Asset, Expense">Debit</th><th title="Increase Liability, Income">Credit</th></tr></thead>
        <tbody></tbody>
    </table>
    <p class="Buttons">
        <button data-action="add_split"><span class="material-symbols-outlined">add</span><br/>Add<br/>Split</button>
        <button data-action="edit_tran"><span class="material-symbols-outlined">check</span><br/>Save<br/>Changes</button>
        <button data-action="go_main"><span class="material-symbols-outlined">close</span><br/>Cancel<br/>Changes</button>
        <button data-action="del_tran"><span class="material-symbols-outlined">delete</span><br/>Delete<br/>Transaction</button>
    </p>
</section>

    </div>
    <section id="PopUp"><p>A</p></section>
</body>
</html>
