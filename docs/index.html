<!DOCTYPE html>
<html lang="en-ca">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Simple Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="shortcut icon" type="image/svg+xml" href="favicon.svg" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Mono:wght@100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@40,400,0,0&icon_names=file_open,download,balance,currency_exchange,add,delete,check,close,settings" />
<link rel="stylesheet" href="style.css"/>
<script type="text/javascript" src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script type="text/javascript" src="script.js"></script>
<script type="text/javascript">

</script>
</head>
<body>
<nav>
    <button onclick="export_data()" class="Modified"><span class="material-symbols-outlined">download</span><br/>Save<br/>&nbsp;</button>
    <button onclick="inc_st_click(event)" title="[Ctrl + Alt + Click] to reset ledger for next accounting period"><span class="material-symbols-outlined">currency_exchange</span><br/>Income<br/>Statement</button>
    <button onclick="show(1)"><span class="material-symbols-outlined">balance</span><br/>Balance<br/>Sheet</button>
    <button onclick="settings()"><span class="material-symbols-outlined">settings</span><br/>Settings<br/>&nbsp;</button>
    <span class="Right">
        <div>
            <button id="NewBtn" onclick="edit_transaction(false)"><span class="material-symbols-outlined">add</span><br/>New<br/>Transaction</button>
        </div>
        <div id="Dates">
            <span><input id="DateStart" type="date"/> &nbsp; – &nbsp;
            <input id="DateEnd" type="date"/></span> &nbsp;
            <button onclick="calc_bal(1);show()"><span class="material-symbols-outlined">check</span><br/>Apply<br/>Dates</button>
        </div>
    </span>
</nav>
<article id="IncomeStatement"></article>
<article id="BalanceSheet"></article>
<article id="Ledger"></article>
<article id="OpenFile">
    <p class="Center">
        <input class="Hidden" type="file" accept=".csv" oninput="open_file(this)"/>
        <button onclick="$('#OpenFile input').trigger('click')"><span class="material-symbols-outlined">file_open</span> &nbsp; <span>Import Ledgers File</span></button><button onclick="init()"><span class="material-symbols-outlined">add</span> &nbsp; Create New Ledgers</button>
    </p>
</article>
<div id="Cover"></div>
<section id="Dialogs">
    <div id="Settings" class="em20">
        <h3>Settings</h3>
        <p>Report Levels:</p>
        <p class="Center"><select id="ReportLevel">
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>5</option>
            <option>6</option>
        </select></p>
        <p>Opening Date:</p>
        <p class="Center"><input id="OpenDate" type="date"/></p>
        <p class="Buttons">
            <button onclick="settings.button()"><span class="material-symbols-outlined">check</span><br/>Okay</button>
        </p>
    </div>
    <div id="NewAcct">
        <h3><span id="EditType"></span> Account</h3>
        <p>Parent Account:</p>
        <p class="Center" id="ParentAcct"></p>
        <p><label for="AcctName">Account Name: </label></p>
        <p class="Center"><input class="em20" type="text" id="AcctName"/></p>
        <p><input type="checkbox" id="PH" onchange="edit_acct.toggle(this)"/> <label for="PH">Placeholder Account</label></p>
        <div>
            <p><label for="OpenBal">Opening Balance: </label></p>
            <p class="Center">$ <input class="em16" type="number" value="0" step="0.01" id="OpenBal"/></p>
        </div>
        <p class="Buttons">
            <button onclick="edit_acct.button(1)"><span class="material-symbols-outlined">check</span><br/>Save</button>
            <button onclick="edit_acct.button(0)"><span class="material-symbols-outlined">close</span><br/>Cancel</button>
        </p>
    </div>
    <div id="EditTr">
        <h3>Edit Transaction</h3>
        <p>
            <input id="TrDate" type="date"/> &nbsp;
            <span class="Right"><input id="TrDescr" class="em32" type="text"/></span>
        </p>
        <table>
            <thead><tr><th>Account</th><th title="Increase Asset, Expense">Debit</th><th title="Increases Revenue, Liability, Equity">Credit</th></tr></thead>
            <tbody></tbody>
        </table>
        <p class="Buttons">
            <button onclick="edit_transaction.button(2)"><span class="material-symbols-outlined">add</span><br/>Add<br/>Split</button>
            <button onclick="edit_transaction.button(1)"><span class="material-symbols-outlined">check</span><br/>Save<br/>Changes</button>
            <button onclick="edit_transaction.button(0)"><span class="material-symbols-outlined">close</span><br/>Cancel<br/>Changes</button>
            <button onclick="edit_transaction.button(3)"><span class="material-symbols-outlined">delete</span><br/>Delete<br/>Transaction</button>
        </p>
    </div>
</section>
</body>
</html>
